apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  # Khai báo trước bằng IaC để Grafana tự nhận Loki ở giai đoạn 4.
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
